<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>中班学习乐园 · 幼儿园中班家庭作业</title>
<link rel="icon" href="data:,"/>
<style>
:root{
  --orange:#f97316; --pink:#ec4899; --red:#ef4444; --blue:#3b82f6; --sky:#0ea5e9;
  --green:#10b981; --violet:#8b5cf6; --amber:#f59e0b; --teal:#14b8a6; --ink:#4b3f32;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#fff8ec 0%,#ffeef4 45%,#eef7ff 100%);
  background-attachment:fixed;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;}
.hidden{display:none !important;}

/* ---------- 顶部 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  padding:10px 16px;box-shadow:0 2px 14px rgba(0,0,0,.06);
}
.logo{font-size:1.25rem;font-weight:900;cursor:pointer;letter-spacing:1px;}
.logo .huh{display:block;font-size:.68rem;font-weight:600;color:#b08968;letter-spacing:2px;}
.pill{background:linear-gradient(135deg,#ffe08a,#ffc53d);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 2px 6px rgba(245,158,11,.35);}
.spacer{flex:1;}
.ibtn{background:#fff;border:2px solid #f3e8d8;border-radius:999px;padding:7px 12px;font-size:.95rem;font-weight:700;color:#8a6d4b;transition:.15s;}
.ibtn:hover{background:#fff7ec;transform:translateY(-1px);}

/* ---------- 导航 ---------- */
.tabs{position:sticky;top:56px;z-index:40;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:rgba(255,251,244,.9);backdrop-filter:blur(6px);scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:8px 14px;font-size:.95rem;font-weight:800;color:#6b5138;box-shadow:0 1px 4px rgba(0,0,0,.08);white-space:nowrap;}
.tab.on{color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.tab .n{font-size:.72rem;opacity:.85;}

/* ---------- 主区 ---------- */
main{max-width:980px;margin:0 auto;padding:18px 14px 90px;}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 6px 24px rgba(201,159,98,.12);margin-bottom:16px;}

/* ---------- 首页 ---------- */
.banner{
  border-radius:28px;padding:26px 22px;color:#fff;
  background:linear-gradient(120deg,#ff9a56,#ff6f91 55%,#c86dd7);
  box-shadow:0 10px 30px rgba(255,111,145,.35);position:relative;overflow:hidden;
}
.banner h1{margin:0 0 6px;font-size:1.7rem;letter-spacing:1px;}
.banner .sub{font-size:.98rem;opacity:.96;}
.banner .floats{font-size:1.5rem;position:absolute;right:18px;top:14px;animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-9px) rotate(5deg);}}
.todaytag{display:inline-block;margin-top:12px;background:rgba(255,255,255,.25);border-radius:16px;padding:9px 14px;font-weight:800;font-size:.98rem;cursor:pointer;transition:.15s;}
.todaytag:hover{background:rgba(255,255,255,.4);}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.mcard{background:#fff;border-radius:22px;padding:18px 14px;text-align:center;box-shadow:0 4px 14px rgba(201,159,98,.12);cursor:pointer;transition:.18s;border:3px solid transparent;}
.mcard:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(201,159,98,.2);}
.mcard .ic{font-size:2.6rem;display:block;margin-bottom:6px;}
.mcard .nm{font-weight:900;font-size:1.05rem;}
.mcard .ds{font-size:.74rem;color:#a58c6b;margin:5px 2px;line-height:1.45;}
.mbar{height:8px;background:#f4ece0;border-radius:99px;overflow:hidden;margin-top:8px;}
.mbar i{display:block;height:100%;border-radius:99px;}
.mcard .cnt{font-size:.75rem;color:#a58c6b;margin-top:4px;}
.sect{font-size:1.05rem;font-weight:900;margin:22px 4px 12px;display:flex;align-items:center;gap:8px;}
.sect .line{flex:1;height:2px;background:#f0e3cf;border-radius:2px;}
.tips{display:flex;gap:10px;flex-wrap:wrap;}
.tip{flex:1 1 200px;background:#fff;border-radius:18px;padding:12px 14px;font-size:.88rem;box-shadow:0 3px 10px rgba(201,159,98,.1);}
.tip b{color:var(--orange);}

/* ---------- 模块/题页 ---------- */
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.mhead .big{font-size:2.4rem;}
.mhead h2{margin:0;font-size:1.5rem;}
.mhead .dsc{width:100%;color:#8a6d4b;font-size:.92rem;margin-top:-6px;}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.setcard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px;cursor:pointer;box-shadow:0 3px 12px rgba(201,159,98,.12);transition:.15s;border:3px solid transparent;}
.setcard:hover{transform:translateY(-3px);}
.setcard .em{font-size:2rem;}
.setcard .nm{font-weight:900;flex:1;}
.setcard .st{font-size:.75rem;color:#a58c6b;}
.setcard .go{font-weight:900;font-size:1.1rem;color:#c9a06a;}

.qcard{background:#fff;border-radius:26px;padding:22px;box-shadow:0 8px 28px rgba(201,159,98,.14);position:relative;overflow:hidden;}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.qprog{flex:1;text-align:center;font-size:.85rem;color:#a58c6b;font-weight:700;}
.tbtn{background:#fff;border:2px solid #f0e3cf;border-radius:14px;padding:7px 12px;font-weight:800;color:#8a6d4b;font-size:.9rem;}
.tbtn:hover{background:#fff8ee;}
.qpic{text-align:center;padding:16px 8px;font-size:76px;line-height:1.3;word-break:break-all;}
.qpic.small{font-size:52px;}
.qpic [class]{vertical-align:middle;}
.qtext{font-size:1.32rem;font-weight:900;line-height:1.75;padding:6px 12px;text-align:center;}
.qtext .spk{background:#fff;border:2px solid #ffe3a9;border-radius:999px;width:42px;height:42px;font-size:1.1rem;vertical-align:middle;margin-left:6px;}
.qtext .spk:active{transform:scale(.92);}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px;}
.opt{
  background:linear-gradient(180deg,#fff,#fff7ea);border:3px solid #f0d9b0;border-radius:20px;
  padding:16px 10px;font-size:1.5rem;font-weight:900;color:#5b4630;transition:.12s;min-height:64px;
  display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 #e8cf9f;
}
.opt:hover{background:linear-gradient(180deg,#fff,#ffedc9);}
.opt:active{transform:translateY(2px);box-shadow:none;}
.no-wrap{white-space:nowrap;}
.opt:disabled{cursor:default;opacity:.55;transform:none;}
.opt.right{background:linear-gradient(180deg,#d9ffe9,#b8f5cf);border-color:#34d399;color:#065f46;animation:pop .45s;}
.opt.right:disabled{opacity:1;}
.opt.wrong{background:linear-gradient(180deg,#ffe4e4,#ffc6c6);border-color:#f87171;color:#991b1b;animation:shake .45s;}
.opt.wrong:disabled{opacity:.65;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}50%{transform:translateX(7px);}75%{transform:translateX(-4px);}}
.glyphspan{font-size:1.9em;line-height:1;}
.hintwrap{margin-top:12px;text-align:center;}
.hintwrap details{display:inline-block;}
.hintwrap summary{cursor:pointer;background:#fff;border:2px dashed #f0d9b0;border-radius:14px;padding:7px 16px;font-weight:800;color:#a5834f;list-style:none;font-size:.95rem;}
.hintwrap summary::-webkit-details-marker{display:none;}
.hintwrap p{background:#fffaf0;border-radius:14px;padding:10px 14px;font-size:.92rem;max-width:520px;margin:8px auto 0;color:#8a6d4b;line-height:1.6;}
.feedback{margin-top:14px;}
.praise{text-align:center;font-size:1.45rem;font-weight:900;color:var(--green);animation:pop .5s;}
.nudge{text-align:center;font-size:1.05rem;font-weight:800;color:#e08600;margin-top:10px;}
.anscard{background:linear-gradient(135deg,#eafff4,#d7f9ec);border:3px solid #6ee7b7;border-radius:22px;padding:16px 18px;margin-top:14px;animation:rise .4s ease;position:relative;overflow:hidden;text-align:center;}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.anscard .ah{font-size:1.25rem;font-weight:900;color:#047857;}
.anscard .why{margin-top:8px;font-size:1.02rem;line-height:1.85;color:#065f46;text-align:left;}
.anscard .why b{color:#047857;}
.anscard .spk2{margin-top:10px;background:#fff;border:2px solid #86efac;border-radius:999px;padding:8px 18px;font-weight:800;color:#047857;font-size:.95rem;}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.mainbtn{
  background:linear-gradient(135deg,#ff8a4c,#ff6472);color:#fff;border-radius:999px;padding:12px 26px;
  font-size:1.08rem;font-weight:900;box-shadow:0 5px 14px rgba(255,100,114,.4);transition:.15s;letter-spacing:1px;
}
.mainbtn:active{transform:translateY(2px);}
.ghostbtn{background:#fff;border:3px solid #f0d9b0;color:#8a6d4b;border-radius:999px;padding:11px 22px;font-size:1rem;font-weight:800;}
.ghostbtn:hover{background:#fff8ee;}
.answersmall{background:#fff3d8;border:3px solid #fcd34d;color:#92400e;border-radius:999px;padding:11px 20px;font-size:1rem;font-weight:900;animation:wink 1.4s infinite;}
@keyframes wink{0%,100%{box-shadow:0 0 0 0 rgba(252,211,77,.5);}50%{box-shadow:0 0 0 9px rgba(252,211,77,0);}}
.conf{position:absolute;top:-12px;z-index:5;pointer-events:none;animation:fall 1.8s ease-in forwards;}
@keyframes fall{to{transform:translateY(240px) rotate(260deg);opacity:0;}}

/* ---------- 完成面板 ---------- */
.donepanel{text-align:center;padding:26px 18px;}
.donepanel .big{font-size:4rem;animation:bob 1.6s infinite;}
.donepanel h3{font-size:1.6rem;margin:10px 0 4px;}
.donepanel .sub{color:#a58c6b;margin-bottom:18px;}

/* ---------- 家长专区 ---------- */
.acc{background:#fff;border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:0 3px 10px rgba(201,159,98,.1);}
.acc summary{padding:14px 18px;font-weight:900;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;font-size:1.05rem;}
.acc summary::-webkit-details-marker{display:none;}
.acc summary .arr{margin-left:auto;transition:.2s;color:#c9a06a;}
.acc[open] summary .arr{transform:rotate(90deg);}
.acc .bd{padding:4px 18px 16px;font-size:.95rem;line-height:1.9;color:#6b5138;}
table.plan{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px rgba(201,159,98,.1);}
table.plan th{background:#fff1d6;padding:10px 8px;color:#8a5612;text-align:left;}
table.plan td{padding:10px 8px;border-top:1px solid #f6ecdc;vertical-align:top;}
table.plan td:first-child{font-weight:800;white-space:nowrap;}
.ptag{display:inline-block;background:#efe8ff;color:#6d28d9;border-radius:8px;padding:1px 8px;font-size:.78rem;font-weight:800;margin:2px 2px 0 0;}
.bardiv{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.bardiv .lbl{width:110px;font-weight:800;font-size:.92rem;}
.bardiv .bar{flex:1;height:12px;background:#f4ece0;border-radius:99px;overflow:hidden;}
.bardiv .bar i{display:block;height:100%;border-radius:99px;transition:.4s;}
.bardiv .num{width:90px;font-size:.8rem;color:#a58c6b;text-align:right;}

/* ---------- 儿歌 ---------- */
.poem{background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 4px 14px rgba(201,159,98,.12);margin-bottom:14px;}
.poem h3{margin:0 0 4px;font-size:1.3rem;}
.poem .by{color:#a58c6b;font-size:.85rem;margin-bottom:10px;}
.poem .lines{font-size:1.28rem;line-height:2.15;font-weight:800;letter-spacing:2px;}
.poem .note{font-size:.88rem;color:#8a6d4b;background:#fff7ea;border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.7;}
.poem .row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}

/* ---------- 弹窗/设置 ---------- */
.modal{position:fixed;inset:0;background:rgba(60,42,20,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modalCard{background:#fff;border-radius:24px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:86vh;overflow:auto;}
.modalCard h3{margin:0 0 14px;font-size:1.3rem;}
.modalCard.wide{max-width:790px;}
.animbox{width:100%;aspect-ratio:720/405;background:#f6efe4;border-radius:16px;overflow:hidden;margin:6px 0 10px;}
.animtips{font-size:.85rem;color:#a58c6b;line-height:1.7;text-align:center;}
.anscard .btnrow2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.animbtn{background:linear-gradient(135deg,#ffe08a,#ffb13d);border-color:#f0a33a;color:#8a5612;}
.formrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:800;font-size:.95rem;}
.formrow input[type=range]{flex:1;}
.switch{position:relative;width:52px;height:28px;background:#e8dcc8;border-radius:999px;cursor:pointer;transition:.2s;flex:0 0 auto;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on{background:#34d399;}
.switch.on::after{left:27px;}
.small{font-size:.8rem;color:#a58c6b;line-height:1.6;}
.danger{background:#fff0f0;border:2px solid #fda4af;color:#be123c;border-radius:14px;padding:10px 16px;font-weight:800;}
.voices{margin-top:10px;background:#f8f4ec;border-radius:12px;padding:10px 12px;font-size:.82rem;color:#8a6d4b;max-height:110px;overflow:auto;line-height:1.7;}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#3d3227;color:#fff;padding:10px 20px;border-radius:999px;font-size:.92rem;opacity:0;transition:.3s;z-index:120;pointer-events:none;max-width:86vw;}
#toast.show{opacity:.96;transform:translateX(-50%) translateY(0);}

/* ---------- 打印 ---------- */
#printArea{display:none;}
@media print{
  body{background:#fff;}
  #app,#modalBack,#toast{display:none !important;}
  #printArea{display:block !important;}
}
.print-sheet{padding:10px;color:#000;}
.print-sheet h1{font-size:20px;text-align:center;margin:6px 0;}
.print-sheet .pmeta{display:flex;gap:14px;font-size:13px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px;justify-content:space-between;font-weight:bold;}
.pitem{display:flex;align-items:center;gap:12px;margin:12px 0;font-size:16px;min-height:52px;page-break-inside:avoid;}
.pitem .ppic{font-size:34px;width:70px;text-align:center;flex:0 0 auto;}
.pitem .pq{flex:1;font-weight:bold;line-height:1.6;}
.pblank{width:90px;border-bottom:2px solid #000;height:30px;flex:0 0 auto;}
.pans{margin-top:16px;border-top:1px dashed #999;padding-top:8px;font-size:11px;color:#444;line-height:1.8;}
.poemprint h3{font-size:17px;margin:14px 0 2px;}
.poemprint .pl{font-size:15px;line-height:2;font-weight:bold;}

@media (max-width:600px){
  .topbar{padding:8px 10px;}
  .logo{font-size:1.05rem;}
  .tabs{top:52px;}
  main{padding:12px 10px 90px;}
  .mgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .mcard .ic{font-size:2rem;}
  .qpic{font-size:56px;}
  .qtext{font-size:1.14rem;}
  .opt{font-size:1.25rem;padding:13px 8px;}
  .banner h1{font-size:1.35rem;}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo" onclick="location.hash='#/home'">🐰 中班学习乐园<span class="huh">幼儿园中班 · 家庭作业互动课堂</span></div>
    <div class="pill" id="starPill">⭐ 0</div>
    <div class="spacer"></div>
    <button class="ibtn" onclick="openSettings()">⚙️ 设置</button>
    <button class="ibtn" onclick="location.hash='#/parents'">👨‍👩‍👧 家长专区</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="printArea"></div>
<div id="modalBack" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="modalCard" id="modalCard"></div>
</div>
<div id="toast"></div>

<script src="data_read.js"></script>
<script src="data_math.js"></script>
<script src="data_calc.js"></script>
<script src="data_shape.js"></script>
<script src="data_logic.js"></script>
<script src="data_science.js"></script>
<script src="data_safe.js"></script>
<script src="data_song.js"></script>
<script src="data_eng.js"></script>
<script src="anim/anim-player.js?v=3"></script>

<script>
/* =========================================================
   中班学习乐园 · 交互引擎
   ========================================================= */
window.DATASETS = window.DATASETS || [];

/* ---------- 存储 ---------- */
function freshStore(){ return { s:{ rate:0.8, autoRead:true, sfx:true }, done:{} }; }
let store;
try{ store = JSON.parse(localStorage.getItem('zzb_store')) || freshStore(); }
catch(e){ store = freshStore(); }
if(!store.s) store.s = Object.assign(freshStore().s, store.s||{});
if(!store.done) store.done = {};
function save(){ try{ localStorage.setItem('zzb_store', JSON.stringify(store)); }catch(e){} }

/* ---------- 会话状态 ---------- */
let S = { mid:null, si:null, qi:0, done:false, firstTry:true, wrongs:0, setStars:0, streak:0 };

const PRAISE = ['太棒啦！👏','你真聪明！🌟','答对咯！🎉','好厉害呀！💪','真了不起！🏆','给你点个赞！👍','小脑袋真灵光！✨','太厉害了，继续加油！🚀'];
const AGAIN  = ['再想一想哦～🤔','差一点点，加油！💪','没关系，再试一次！😊','仔细看一看图哦～🔍'];

/* ---------- 工具 ---------- */
const mod  = id  => DATASETS.find(m=>m.id===id);
const curQ = () => mod(S.mid).sets[S.si].qs[S.qi];
function totalQs(m){ return m.sets.reduce((a,s)=>a+s.qs.length,0); }
function setInfo(mid,si){ const d=(store.done[mid]||{})[si]||{first:[],helped:[]}; return d; }
function starsOfSet(mid,si){ const d=setInfo(mid,si); return d.first.length*2+d.helped.length; }
function solvedOfSet(mid,si){ const d=setInfo(mid,si); return d.first.length+d.helped.length; }
function starsOfMod(m){ return m.sets.reduce((a,s,si)=>a+starsOfSet(m.id,si),0); }
function solvedOfMod(m){ return m.sets.reduce((a,s,si)=>a+solvedOfSet(m.id,si),0); }
function totalStars(){ return DATASETS.reduce((a,m)=>a+starsOfMod(m),0); }
function totalSolved(){ return DATASETS.reduce((a,m)=>a+solvedOfMod(m),0); }
function totalAll(){ return DATASETS.reduce((a,m)=>a+totalQs(m),0); }
function isDone(mid,si,qi){ const d=(store.done[mid]||{})[si]; return d ? (d.first.includes(qi)||d.helped.includes(qi)) : false; }
function mark(qi,kind){
  const md = store.done[S.mid] = store.done[S.mid]||{};
  const d  = md[S.si] = md[S.si]||{first:[],helped:[]};
  if(!d[kind].includes(qi)) d[kind].push(qi);
  save(); updatePill();
}

const GLYPH_NAME = {'○':'圆形','□':'正方形','▭':'长方形','△':'三角形','☆':'星形','♡':'心形','▲':'三角形','■':'正方形','●':'圆形'};
function isSvg(s){ return typeof s==='string' && s.trim().startsWith('<'); }
function optHtml(o){
  if(isSvg(o)) return o;
  if(GLYPH_NAME[o]) return '<span class="glyphspan">'+o+'</span>';
  return o;
}
function optText(o){
  if(isSvg(o)) return o.replace(/<[^>]+>/g,'').trim();
  return GLYPH_NAME[o] || o;
}
const CJK_NUM = /^[\u4e00-\u9fa5a-zA-Z0-9，。、><=±！？?.\- ]+$/;
function speakableOpt(o){ return CJK_NUM.test(optText(o)); }

/* ---------- 语音 ---------- */
const synth = window.speechSynthesis;
let voicesCached = [];
function refreshVoices(){ if(synth) voicesCached = synth.getVoices(); }
if(synth){ refreshVoices(); if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged = refreshVoices; }
setInterval(refreshVoices, 3000);
function pickVoice(lang){
  if(!voicesCached.length) return null;
  const base = (lang||'zh-CN').slice(0,2).toLowerCase();
  const vs = voicesCached.filter(v=>(v.lang||'').toLowerCase().startsWith(base));
  if(!vs.length) return null;
  return vs.find(v=>/xiaoxiao|晓晓|huihui|kangkang|yaoyao/i.test(v.name)) || vs[0];
}
function speak(txt, lang){
  if(!synth) { toast('当前浏览器不支持语音朗读 (请用 Edge / Chrome 打开)'); return false; }
  if(!txt) return false;
  try{
    synth.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang  = lang || 'zh-CN';
    const v = pickVoice(u.lang); if(v) u.voice = v;
    u.rate  = store.s.rate || 0.8;
    u.pitch = u.lang.startsWith('en') ? 1.0 : 1.12;
    synth.speak(u);
    return true;
  }catch(e){ return false; }
}
function sayQ(){
  const q = curQ();
  let t = q.q;
  const spoke = q.opts.map(optText).filter(speakableOpt);
  if(spoke.length) t += '。请选一选：' + spoke.join('、');
  speak(t, q.lang);
}

/* ---------- 音效 ---------- */
let AC=null;
function acInit(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function note(f,at,d){ if(!AC) return; const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.001,at); g.gain.exponentialRampToValueAtTime(0.22,at+0.02); g.gain.exponentialRampToValueAtTime(0.001,at+d);
  o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at+d+0.05); }
function sfx(ok){
  if(!store.s.sfx) return;
  acInit(); if(!AC) return;
  const t = AC.currentTime;
  if(ok){ note(523.25,t,0.12); note(783.99,t+0.1,0.2); } else { note(196,t,0.22); }
}

    const s=document.createElement('span'); s.className='conf'; s.textContent=cs[i%cs.length];
    s.style.left=(4+Math.random()*92)+'%'; s.style.animationDelay=(Math.random()*0.45)+'s';
    s.style.fontSize=(16+Math.random()*20)+'px';
    el.appendChild(s); setTimeout(()=>s.remove(), 2600);
  }
}

    mark(S.qi, 'first');
    S.setStars = starsOfSet(S.mid,S.si);
    showAns(true,false);
  } else {
    el.classList.add('wrong'); el.disabled=true;
    S.firstTry=false; S.wrongs++; sfx(false);
    const fb=document.getElementById('feedback');
    fb.innerHTML='<div class="nudge">'+AGAIN[Math.min(S.wrongs-1,AGAIN.length-1)]+'</div>';

/* ---------- 🎬 动画讲解（Remotion 播放器） ---------- */
function stripPlain(s){ return String(s||'').replace(/<[^>]+>/g,''); }
function picTokens(s){ return Array.from(stripPlain(s).trim().split(/\s+/)); }
function buildAnimProps(mid,si,q){
  const toks = picTokens(q.pic);
  const emo  = toks.length ? toks[0] : '🍎';
  const cntOf = e => toks.filter(t=>t===e).length;
  if(mid==='calc'){
    const ns=(q.q.match(/\d+/g)||[]).map(Number);
    if(si===0||si===2){
      const a=ns[0]||1, b=ns[1]||1;
      return {type:'add',emoji:emo,a,b,duration:Math.max(420,(a+b)*20+340)};
    }
    if(si===1||si===3){
      const a=ns[0]||3, b=ns[1]||1;
      const t=q.q;
      const mode=/吃/.test(t)?'eat':/飞/.test(t)?'fly':/游|藏/.test(t)?'swim':/送|摘|发/.test(t)?'give':'eat';
      return {type:'sub',emoji:emo,a,b,mode,duration:Math.max(400,a*16+b*38+210)};
    }
    if(si===4){
      const t=ns[0]||5, p=ns[1]||1;
      return {type:'split',emoji:emo,t,p,duration:t*26+270};
    }
  }
  if(mid==='math'){
    if(si===0||si===1){
      const n=parseInt(q.opts[q.a],10); if(isNaN(n)) return null;
      return {type:'count',emoji:si===0?'🟠':emo,n,duration:Math.max(200,20+n*30+170)};
    }
    if(si===2){
      const gs=stripPlain(q.pic).split('　').map(x=>x.trim()).filter(Boolean);
      if(gs.length>=2 && !/\d/.test(gs[0])){
        const aE=picTokens(gs[0])[0], bE=picTokens(gs[1])[0];
        const aN=picTokens(gs[0]).filter(x=>x===aE).length, bN=picTokens(gs[1]).filter(x=>x===bE).length;
        return {type:'compare',aE,bE,aN,bN,rel:aN>bN?'>':(aN<bN?'<':'='),duration:330};
      }
      const ns=(q.q.match(/\d+/g)||[]).map(Number);
      const ansT=String(q.opts[q.a]);
      const rel=(ansT==='>'||ansT==='<'||ansT==='=')?ansT:((ns[0]>ns[1])?'>':(ns[0]<ns[1])?'<':'=');
      return {type:'compare',aN:ns[0]||1,bN:ns[1]||1,rel,duration:330};
    }
    if(si===3){
      const counts={}; toks.forEach(x=>counts[x]=(counts[x]||0)+1);
      const diff=Object.keys(counts).find(k=>counts[k]===1);
      const pos=diff ? toks.indexOf(diff)+1 : 1;
      return {type:'ordinal',items:toks,pos,duration:120+toks.length*38+110};
    }
    if(si===4){
      const n=parseInt(stripPlain(q.pic),10); if(isNaN(n)) return null;
      return {type:'neighbor',n,duration:340};
    }
    if(si===5){
      const ansT=String(q.opts[q.a]);
      if(ansT.startsWith('左')||ansT.startsWith('右')) return {type:'oddLine',duration:320};
      const digits=stripPlain(q.pic).match(/\d+/);
      if(digits){ const dn=parseInt(digits[0],10); return {type:'oddEven',emoji:'🔵',n:dn,duration:Math.max(340,30+dn*30+240)}; }
      const cn=cntOf(emo);
      return {type:'oddEven',emoji:emo,n:cn,duration:Math.max(340,30+cn*30+240)};
    }
  }
  return null;
}
function openAnim(){
  const m=mod(S.mid), q=curQ();
  const p=buildAnimProps(S.mid,S.si,q);
  if(!p){ toast('这道题暂时没有动画，听小老师讲讲吧～'); return; }
  if(!window.ZZBAnim){ toast('动画组件加载失败，请检查网络后刷新页面'); return; }
  const el=document.getElementById('modalCard');
  el.classList.add('wide');
  el.innerHTML='<h3>🎬 动画讲解 <span style="font-size:.85rem;font-weight:600;color:#a58c6b">— '+(m.short)+' · 看完动画再试一次，秒懂！</span></h3>'+
    '<div class="animbox" id="animBox"></div>'+
    '<div class="animtips">⏯ 点中间的播放键开始，可以随时暂停、重播；看完点「关闭」</div>'+
    '<div class="btnrow" style="margin-top:12px"><button class="mainbtn" onclick="closeModal()">关闭动画</button></div>';
  document.getElementById('modalBack').classList.remove('hidden');
  setTimeout(()=>{
    const box=document.getElementById('animBox');
    if(box && window.ZZBAnim) window.ZZBAnim.play(p, box);
  }, 60);
}
