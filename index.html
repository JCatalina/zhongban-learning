/* ---------- 🔗 幼儿动手连线互动引擎 (Match Line Engine) ---------- */
function renderMatchHtml(q){
  const pairs = q.match.pairs || [];
  const leftList = pairs.map((p, idx) => ({ ...p.left, pairId: idx }));
  const rightList = pairs.map((p, idx) => ({ ...p.right, pairId: idx }));
  
  // 洗牌打乱右侧顺序
  for(let i = rightList.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const temp = rightList[i];
    rightList[i] = rightList[j];
    rightList[j] = temp;
  }

  const leftCols = leftList.map(item =>
    '<div class="match-item" data-col="left" data-pair="' + item.pairId + '">' +
      '<div class="match-item-content">' +
        (item.pic ? '<span class="match-item-pic">' + item.pic + '</span>' : '') +
        '<span>' + item.text + '</span>' +
      '</div>' +
      '<div class="match-dot"></div>' +
    '</div>'
  ).join('');

  const rightCols = rightList.map(item =>
    '<div class="match-item" data-col="right" data-pair="' + item.pairId + '">' +
      '<div class="match-dot"></div>' +
      '<div class="match-item-content">' +
        (item.pic ? '<span class="match-item-pic">' + item.pic + '</span>' : '') +
        '<span>' + item.text + '</span>' +
      '</div>' +
    '</div>'
  ).join('');

  return '<div class="match-container" id="matchContainer">' +
    '<div class="match-tip-bar">' +
      '<span>🔗 动动小手指：按住连线，或分别点击两边配对！</span>' +
      '<button class="match-reset-btn" type="button" onclick="resetCurrentMatch()">🔄 重新连线</button>' +
    '</div>' +
    '<div class="match-board" id="matchBoard">' +
      '<svg class="match-svg-canvas" id="matchCanvas"></svg>' +
      '<div class="match-col" id="matchColLeft">' + leftCols + '</div>' +
      '<div class="match-col" id="matchColRight">' + rightCols + '</div>' +
    '</div>' +
  '</div>';
}

const MATCH_LINE_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'];

function initPointerMatch(containerId, onAllMatched){
  const container = document.getElementById(containerId);
  if(!container) return;
  const board = container.querySelector('.match-board');
  const svg = container.querySelector('.match-svg-canvas');
  const items = container.querySelectorAll('.match-item');
  if(!board || !svg) return;

  const matchedPairs = new Map();
  let selectedItem = null;
  let activeDragItem = null;
  let previewPath = null;
  let isDragging = false;
  let startX = 0, startY = 0;

  function getDotPoint(item){
    const dot = item.querySelector('.match-dot');
    const dotRect = dot.getBoundingClientRect();
    const boardRect = board.getBoundingClientRect();
    return {
      x: dotRect.left + dotRect.width / 2 - boardRect.left,
      y: dotRect.top + dotRect.height / 2 - boardRect.top
    };
  }

  function calcCurvePath(p1, p2){
    const cx1 = p1.x + (p2.x - p1.x) * 0.45;
    const cy1 = p1.y;
    const cx2 = p1.x + (p2.x - p1.x) * 0.55;
    const cy2 = p2.y;
    return 'M ' + p1.x + ' ' + p1.y + ' C ' + cx1 + ' ' + cy1 + ', ' + cx2 + ' ' + cy2 + ', ' + p2.x + ' ' + p2.y;
  }

  function refreshAllLines(){
    matchedPairs.forEach(rec => {
      const p1 = getDotPoint(rec.leftItem);
      const p2 = getDotPoint(rec.rightItem);
      rec.pathEl.setAttribute('d', calcCurvePath(p1, p2));
    });
  }

  window.addEventListener('resize', refreshAllLines);

  function confirmMatch(itemA, itemB){
    const left = itemA.dataset.col === 'left' ? itemA : itemB;
    const right = itemA.dataset.col === 'right' ? itemA : itemB;
    const pairId = left.dataset.pair;

    const color = MATCH_LINE_COLORS[matchedPairs.size % MATCH_LINE_COLORS.length];
    const p1 = getDotPoint(left);
    const p2 = getDotPoint(right);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'match-line confirmed');
    path.setAttribute('stroke', color);
    path.setAttribute('d', calcCurvePath(p1, p2));
    svg.appendChild(path);

    left.classList.add('matched');
    right.classList.add('matched');
    left.classList.remove('selected');
    right.classList.remove('selected');

    matchedPairs.set(pairId, { leftItem: left, rightItem: right, color: color, pathEl: path });
    sfx(true);

    const totalPairs = board.querySelectorAll('.match-col:first-child .match-item').length;
    if(matchedPairs.size >= totalPairs){
      setTimeout(() => {
        if(typeof onAllMatched === 'function') onAllMatched();
      }, 350);
    }
  }

  function triggerMismatch(itemA, itemB){
    sfx(false);
    toast('哎呀，它们不是好朋友哦，再试一次！');
    itemA.classList.add('error-shake');
    itemB.classList.add('error-shake');
    setTimeout(() => {
      itemA.classList.remove('error-shake');
      itemB.classList.remove('error-shake');
    }, 450);
  }

  window.resetCurrentMatch = function(){
    matchedPairs.forEach(rec => rec.pathEl.remove());
    matchedPairs.clear();
    items.forEach(it => {
      it.classList.remove('matched', 'selected', 'error-shake');
    });
    if(previewPath) { previewPath.removeAttribute('d'); }
    selectedItem = null;
    activeDragItem = null;
    isDragging = false;
    toast('已重置，重新连一连吧！');
  };

  items.forEach(item => {
    item.addEventListener('pointerdown', e => {
      if(item.classList.contains('matched')) return;
      activeDragItem = item;
      isDragging = false;
      startX = e.clientX;
      startY = e.clientY;

      if(!previewPath){
        previewPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        previewPath.setAttribute('class', 'match-line preview');
        svg.appendChild(previewPath);
      }
    });

    item.addEventListener('pointermove', e => {
      if(activeDragItem !== item) return;
      const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
      if(dist > 8 && !isDragging){
        isDragging = true;
        try{ item.setPointerCapture(e.pointerId); }catch(err){}
      }

      if(isDragging && previewPath){
        const boardRect = board.getBoundingClientRect();
        const startPt = getDotPoint(item);
        const currPt = {
          x: e.clientX - boardRect.left,
          y: e.clientY - boardRect.top
        };
        previewPath.setAttribute('d', calcCurvePath(startPt, currPt));
      }
    });

    const onPointerEnd = e => {
      if(activeDragItem !== item) return;
      const wasDragging = isDragging;
      activeDragItem = null;
      isDragging = false;
      try{ item.releasePointerCapture(e.pointerId); }catch(err){}

      if(previewPath){
        previewPath.removeAttribute('d');
      }

      if(wasDragging){
        const elemUnder = document.elementFromPoint(e.clientX, e.clientY);
        const targetItem = elemUnder ? elemUnder.closest('.match-item') : null;
        if(targetItem && targetItem !== item && !targetItem.classList.contains('matched')){
          if(targetItem.dataset.col !== item.dataset.col){
            if(targetItem.dataset.pair === item.dataset.pair){
              confirmMatch(item, targetItem);
            } else {
              triggerMismatch(item, targetItem);
            }
          }
        }
      } else {
        if(selectedItem === item){
          item.classList.remove('selected');
          selectedItem = null;
        } else if(!selectedItem){
          item.classList.add('selected');
          selectedItem = item;
          try{ sfx(true); }catch(err){}
        } else {
          if(selectedItem.dataset.col === item.dataset.col){
            selectedItem.classList.remove('selected');
            item.classList.add('selected');
            selectedItem = item;
          } else {
            const first = selectedItem;
            first.classList.remove('selected');
            selectedItem = null;
            if(first.dataset.pair === item.dataset.pair){
              confirmMatch(first, item);
            } else {
              triggerMismatch(first, item);
            }
          }
        }
      }
    };

    item.addEventListener('pointerup', onPointerEnd);
    item.addEventListener('pointercancel', onPointerEnd);
  });
}

/* ---------- 🔗 幼儿动手连线互动舞台 (Match Line Engine) ---------- */
.match-container{
  background:#f8fafc;border:2.5px solid #e2e8f0;border-radius:24px;
  padding:16px 14px;margin:16px 0;box-shadow:0 6px 20px rgba(0,0,0,.04);
  position:relative;user-select:none;-webkit-user-select:none;
}
.match-tip-bar{
  display:flex;align-items:center;justify-content:space-between;
  font-size:.92rem;font-weight:900;color:#c2410c;margin-bottom:8px;padding:0 4px;
}
.match-reset-btn{
  background:#fff;border:1.5px solid #cbd5e1;border-radius:14px;padding:4px 12px;
  font-size:.8rem;font-weight:800;color:#64748b;cursor:pointer;transition:.15s;
}
.match-reset-btn:hover{background:#f1f5f9;color:#334155;border-color:#94a3b8;}
.match-board{
  position:relative;display:flex;justify-content:space-between;align-items:stretch;
  gap:12px;margin:10px 0 6px;min-height:220px;
}
.match-col{
  display:flex;flex-direction:column;justify-content:space-around;gap:12px;
  width:44%;z-index:2;
}
.match-item{
  background:#fff;border:2.5px solid #cbd5e1;border-radius:18px;
  padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;touch-action:none;transition:all .18s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 3px 8px rgba(0,0,0,.05);position:relative;min-height:52px;
}
.match-item:hover{
  border-color:#38bdf8;background:#f0f9ff;transform:scale(1.02);
}
.match-item.selected{
  border-color:#3b82f6;background:#eff6ff;transform:scale(1.04);
  box-shadow:0 6px 18px rgba(59,130,246,.25);
}
.match-item.matched{
  border-color:#10b981;background:#f0fdf4;color:#065f46;
  cursor:default;transform:scale(1);box-shadow:none;
}
.match-item.error-shake{
  animation:matchShake .4s ease-in-out;border-color:#ef4444;background:#fef2f2;
}
@keyframes matchShake{
  0%,100%{transform:translateX(0);}
  20%,60%{transform:translateX(-6px);}
  40%,80%{transform:translateX(6px);}
}
.match-item-content{
  display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:900;
  color:#1e293b;pointer-events:none;
}
.match-item.matched .match-item-content{color:#047857;}
.match-item-pic{font-size:1.4rem;line-height:1;}
.match-dot{
  width:16px;height:16px;border-radius:50%;background:#e2e8f0;
  border:3px solid #94a3b8;flex-shrink:0;transition:.2s;pointer-events:none;
}
.match-item.selected .match-dot{background:#3b82f6;border-color:#1d4ed8;transform:scale(1.25);}
.match-item.matched .match-dot{background:#10b981;border-color:#059669;}
.match-svg-canvas{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:1;overflow:visible;
}
.match-line{
  fill:none;stroke-linecap:round;stroke-linejoin:round;
}
.match-line.preview{
  stroke:#3b82f6;stroke-width:4;stroke-dasharray:6,6;opacity:.85;
}
.match-line.confirmed{
  stroke-width:5;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15));
}

/* 角色动画关键帧 */
@keyframes bounceSlow{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
@keyframes rotateSlow{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes wiggle{ 0%,100%{transform:rotate(0deg);} 25%{transform:rotate(-6deg);} 75%{transform:rotate(6deg);} }
@keyframes sway{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(4deg);} }
@keyframes floatY{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
@keyframes pulseGlow{ 0%,100%{opacity:.4;transform:scale(0.96);} 50%{opacity:.85;transform:scale(1.04);} }
@keyframes tapLeft{ 0%,100%{transform:translateY(0) rotate(0);} 50%{transform:translateY(-14px) rotate(-8deg);} }
@keyframes tapRight{ 0%,100%{transform:translateY(-14px) rotate(8deg);} 50%{transform:translateY(0) rotate(0);} }
@keyframes busBump{ 0%,100%{transform:translate(50px,75px);} 50%{transform:translate(50px,71px);} }
@keyframes wheelSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
@keyframes ballBounce{
  0%,100%{transform:translateY(0) scale(1,1);}
  45%{transform:translateY(55px) scale(1.2,0.8);}
  50%{transform:translateY(60px) scale(1.35,0.65);}
  55%{transform:translateY(52px) scale(0.9,1.15);}
  85%{transform:translateY(-10px) scale(0.95,1.05);}
}

<script>
/* =========================================================
   中班学习乐园 · 交互引擎
   ========================================================= */
window.DATASETS = window.DATASETS || [];

/* ---------- 存储 ---------- */
function freshStore(){ return { s:{ rate:0.8, autoRead:true, sfx:true, eyeCare:15 }, done:{} }; }
let store;
try{ store = JSON.parse(localStorage.getItem('zzb_store')) || freshStore(); }
catch(e){ store = freshStore(); }
if(!store.s) store.s = Object.assign(freshStore().s, store.s||{});
if(store.s.eyeCare === undefined) store.s.eyeCare = 15;
if(!store.done) store.done = {};
function save(){ try{ localStorage.setItem('zzb_store', JSON.stringify(store)); }catch(e){} }

/* ---------- 儿童护眼健康卫士 ---------- */
let _eyeTimer = null;
let _learnSeconds = 0;
function initEyeCareTimer(){
  clearInterval(_eyeTimer);
  _eyeTimer = setInterval(() => {
    const limitMin = store.s.eyeCare !== undefined ? store.s.eyeCare : 15;
    if(limitMin <= 0) return;
    _learnSeconds++;
    if(_learnSeconds >= limitMin * 60){
      _learnSeconds = 0;
      openEyeCareModal(limitMin);
    }
  }, 1000);
}
function openEyeCareModal(min){
  const el = document.getElementById('modalCard');
  if(!el) return;
  el.classList.remove('wide');
  el.innerHTML =
    '<div style="text-align:center;padding:10px 0">'+
      '<div style="font-size:52px;margin-bottom:12px">🌳 👀 ✨</div>'+
      '<h3 style="color:#047857;margin-bottom:10px">小眼睛要休息一下啦～</h3>'+
      '<div style="font-size:.95rem;color:#8a6d4b;line-height:1.8;margin-bottom:16px">'+
        '你已经连续认真学习了 <b>'+min+' 分钟</b>，真棒！👏<br>'+
        '快站起来伸个懒腰，眨眨眼，看看窗外的远方和绿树吧～'+
      '</div>'+
      '<button class="mainbtn" onclick="closeModal()">休息好了，继续闯关 🚀</button>'+
    '</div>';
  document.getElementById('modalBack').classList.remove('hidden');
}

/* ---------- 会话状态 ---------- */
let S = { mid:null, si:null, qi:0, done:false, firstTry:true, wrongs:0, setStars:0, streak:0 };

const PRAISE = ['太棒啦！👏','你真聪明！🌟','答对咯！🎉','好厉害呀！💪','真了不起！🏆','给你点个赞！👍','小脑袋真灵光！✨','太厉害了，继续加油！🚀'];
const AGAIN  = ['再想一想哦～🤔','差一点点，加油！💪','没关系，再试一次！😊','仔细看一看图哦～🔍'];

/* ---------- 工具 ---------- */
const mod  = id  => DATASETS.find(m=>m.id===id);
const curQ = () => mod(S.mid).sets[S.si].qs[S.qi];
function totalQs(m){ return m.sets.reduce((a,s)=>a+s.qs.length,0); }
function setInfo(mid,si){ const d=(store.done[mid]||{})[si]||{first:[],helped:[]}; return d; }
function starsOfSet(mid,si){ const d=setInfo(mid,si); return d.first.length*2+d.helped.length; }
function solvedOfSet(mid,si){ const d=setInfo(mid,si); return d.first.length+d.helped.length; }
function starsOfMod(m){ return m.sets.reduce((a,s,si)=>a+starsOfSet(m.id,si),0); }
function solvedOfMod(m){ return m.sets.reduce((a,s,si)=>a+solvedOfSet(m.id,si),0); }
function totalStars(){ return DATASETS.reduce((a,m)=>a+starsOfMod(m),0); }
function totalSolved(){ return DATASETS.reduce((a,m)=>a+solvedOfMod(m),0); }
function totalAll(){ return DATASETS.reduce((a,m)=>a+totalQs(m),0); }
function isDone(mid,si,qi){ const d=(store.done[mid]||{})[si]; return d ? (d.first.includes(qi)||d.helped.includes(qi)) : false; }
function mark(qi,kind){
  const md = store.done[S.mid] = store.done[S.mid]||{};
  const d  = md[S.si] = md[S.si]||{first:[],helped:[]};
  if(!d[kind].includes(qi)) d[kind].push(qi);
  // 如果首次答对，从需要帮助的列表中移出
  if(kind === 'first'){
    const hIdx = d.helped.indexOf(qi);
    if(hIdx !== -1) d.helped.splice(hIdx, 1);
  }
  save(); updatePill();
}

/* ---------- 错题本检索 ---------- */
function getAllWrongQs(){
  const list = [];
  for(const m of DATASETS){
    if(m.layout === 'song') continue;
    const md = store.done[m.id] || {};
    m.sets.forEach((s, si) => {
      const d = md[si] || { first: [], helped: [] };
      d.helped.forEach(qi => {
        if(!d.first.includes(qi) && s.qs[qi]){
          list.push({
            mid: m.id,
            mName: m.name,
            mIcon: m.icon,
            mColor: m.color,
            si,
            sName: s.name,
            qi,
            q: s.qs[qi]
          });
        }
      });
    });
  }
  return list;
}

const GLYPH_NAME = {'○':'圆形','□':'正方形','▭':'长方形','△':'三角形','☆':'星形','♡':'心形','▲':'三角形','■':'正方形','●':'圆形'};
function isSvg(s){ return typeof s==='string' && s.trim().startsWith('<'); }
function optHtml(o){
  if(isSvg(o)) return o;
  if(GLYPH_NAME[o]) return '<span class="glyphspan">'+o+'</span>';
  return o;
}
function optText(o){
  if(isSvg(o)) return o.replace(/<[^>]+>/g,'').trim();
  return GLYPH_NAME[o] || o;
}
const CJK_NUM = /^[\u4e00-\u9fa5a-zA-Z0-9，。、><=±！？?.\- ]+$/;
function speakableOpt(o){ return CJK_NUM.test(optText(o)); }

/* ---------- 语音 ---------- */
const synth = window.speechSynthesis;
let voicesCached = [];
function refreshVoices(){ if(synth) voicesCached = synth.getVoices(); }
if(synth){ refreshVoices(); if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged = refreshVoices; }
setInterval(refreshVoices, 3000);
function pickVoice(lang){
  if(!voicesCached.length) return null;
  const base = (lang||'zh-CN').slice(0,2).toLowerCase();
  const vs = voicesCached.filter(v=>(v.lang||'').toLowerCase().startsWith(base));
  if(!vs.length) return null;
  return vs.find(v=>/xiaoxiao|晓晓|huihui|kangkang|yaoyao/i.test(v.name)) || vs[0];
}
let _ttsAudio = null;
let _audioPlayer = null;
const _isWeChat = /MicroMessenger/i.test(navigator.userAgent);

function setSpeakingState(active, btn){
  document.querySelectorAll('.speaking-active').forEach(el => el.classList.remove('speaking-active'));
  if(active && btn && btn.classList){
    btn.classList.add('speaking-active');
  }
  if(window.SceneAnimManager){ try{ window.SceneAnimManager.setSpeaking(!!active); }catch(e){} }
}

function _ensureAudioPlayer(){
  if(!_audioPlayer){
    _audioPlayer = new Audio();
    _audioPlayer.addEventListener('ended', () => setSpeakingState(false));
    _audioPlayer.addEventListener('pause', () => setSpeakingState(false));
    _audioPlayer.addEventListener('error', () => setSpeakingState(false));
  }
  return _audioPlayer;
}

function stopSpeak(){
  setSpeakingState(false);
  if(_audioPlayer){ try{ _audioPlayer.playbackRate = 1.0; _audioPlayer.pause(); _audioPlayer.currentTime = 0; }catch(e){} }
  if(_ttsAudio){ try{ _ttsAudio.pause(); _ttsAudio.currentTime = 0; }catch(e){} }
  if(synth){ try{ synth.cancel(); }catch(e){} }
}

function _playOnlineTTS(txt, lang, btn){
  try{
    if(!_ttsAudio){
      _ttsAudio = new Audio();
      _ttsAudio.addEventListener('ended', () => setSpeakingState(false));
      _ttsAudio.addEventListener('pause', () => setSpeakingState(false));
      _ttsAudio.addEventListener('error', () => setSpeakingState(false));
    }
    _ttsAudio.pause();
    const isEn = (lang && lang.startsWith('en')) || /^[a-zA-Z0-9\s.,?!'-]+$/.test(String(txt).trim());
    const voiceType = isEn ? '2' : '1';
    const voiceLang = isEn ? 'en' : 'zh';
    _ttsAudio.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(String(txt).trim()) + '&type=' + voiceType + '&le=' + voiceLang;
    _ttsAudio.currentTime = 0;
    const p = _ttsAudio.play();
    if(p && typeof p.then === 'function'){
      p.then(() => { if(btn) setSpeakingState(true, btn); }).catch(function(){});
    } else if(btn) {
      setSpeakingState(true, btn);
    }
    return true;
  }catch(e){ return false; }
}

function _fallbackTTS(txt, lang, btn){
  if(!txt) return false;
  if(!_isWeChat && synth){
    try{
      synth.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang  = lang || 'zh-CN';
      const v = pickVoice(u.lang); if(v) u.voice = v;
      u.rate  = store.s.rate || 0.8;
      u.pitch = u.lang.startsWith('en') ? 1.0 : 1.12;
      u.onend = () => setSpeakingState(false);
      u.onerror = () => setSpeakingState(false);
      synth.speak(u);
      if(btn) setSpeakingState(true, btn);
      return true;
    }catch(e){}
  }
  return _playOnlineTTS(txt, lang, btn);
}

function speak(txt, lang, audioId, btn, rate){
  stopSpeak();
  if(!txt && !audioId) return false;

  // 1. 优先播放本地预生成的标准 MP3 音频（同源无跨域、高保真晓晓童声、微信100%支持）
  if(audioId){
    try{
      const player = _ensureAudioPlayer();
      player.playbackRate = rate || 1.0;
      player.src = 'audio/' + audioId + '.mp3';
      player.currentTime = 0;
      const p = player.play();
      if(p && typeof p.then === 'function'){
        p.then(() => {
          if(btn) setSpeakingState(true, btn);
        }).catch(function(err){
          console.warn('本地音频被手势限制或未加载完成，尝试回退:', err);
          _fallbackTTS(txt, lang, btn);
        });
      } else {
        if(btn) setSpeakingState(true, btn);
      }
      return true;
    }catch(e){
      return _fallbackTTS(txt, lang, btn);
    }
  }

  // 2. 无本地音频 ID 时回退处理
  return _fallbackTTS(txt, lang, btn);
}

function preloadNextAudio(){
  try{
    const m = mod(S.mid);
    if(!m || !m.sets || !m.sets[S.si]) return;
    const nqi = S.qi + 1;
    if(nqi < m.sets[S.si].qs.length){
      const nextQAudio = new Audio();
      nextQAudio.preload = 'auto';
      nextQAudio.src = 'audio/' + S.mid + '_' + S.si + '_' + nqi + '_q.mp3';

      const nextWAudio = new Audio();
      nextWAudio.preload = 'auto';
      nextWAudio.src = 'audio/' + S.mid + '_' + S.si + '_' + nqi + '_w.mp3';
    }
  }catch(e){}
}

function sayQ(btn){
  const q = curQ();
  let t = q.q;
  const spoke = q.opts.map(optText).filter(speakableOpt);
  if(spoke.length) t += '。请选一选：' + spoke.join('、');
  const targetBtn = btn || document.getElementById('btnSayQ') || document.querySelector('.qtext .spk');
  speak(t, q.lang, S.mid + '_' + S.si + '_' + S.qi + '_q', targetBtn);
}
function sayWhy(btn){
  const q = curQ();
  const targetBtn = btn || document.getElementById('btnSayWhy') || document.querySelector('.anscard .spk2');
  speak((q.w || '') , q.lang, S.mid + '_' + S.si + '_' + S.qi + '_w', targetBtn);
}

/* ---------- 音效 ---------- */
let AC=null;
function acInit(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function note(f,at,d){ if(!AC) return; const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.001,at); g.gain.exponentialRampToValueAtTime(0.22,at+0.02); g.gain.exponentialRampToValueAtTime(0.001,at+d);
  o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at+d+0.05); }
function sfx(ok){
  if(!store.s.sfx) return;
  acInit(); if(!AC) return;
  const t = AC.currentTime;
  if(ok){ note(523.25,t,0.12); note(783.99,t+0.1,0.2); } else { note(196,t,0.22); }
}
function animSfx(){
  if(!store.s.sfx) return;
  acInit(); if(!AC) return;
  const t = AC.currentTime;
  note(523.25, t, 0.08);        // C5
  note(659.25, t + 0.08, 0.08);  // E5
  note(783.99, t + 0.16, 0.12);  // G5
  note(1046.50, t + 0.24, 0.22); // C6 清脆收尾
}

/* ---------- 庆祝动画 ---------- */
function confetti(el){
  const cs=['⭐','🎉','🌈','💖','✨','🎈','🌟','💛'];
  for(let i=0;i<15;i++){
    const s=document.createElement('span'); s.className='conf'; s.textContent=cs[i%cs.length];
    s.style.left=(4+Math.random()*92)+'%'; s.style.animationDelay=(Math.random()*0.45)+'s';
    s.style.fontSize=(16+Math.random()*20)+'px';
    el.appendChild(s); setTimeout(()=>s.remove(), 2600);
  }
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200);
}
function updatePill(){ document.getElementById('starPill').textContent = '⭐ ' + totalStars(); }

/* 题图自适应：长行（排队动物、比多少、10个物品等）在窄屏自动缩小字号，
   保证整行完整显示、不被卡片裁切。
   测量方式：把内容复制到离屏容器按真实单行宽度测量，再按比例缩放（scrollWidth 对居中内联内容不可靠） */
function measurePicWidth(el, fs){
  const m=document.createElement('span');
  m.style.cssText='position:absolute;left:-99999px;top:0;display:inline-block;white-space:nowrap;'
    +'font-family:'+getComputedStyle(el).fontFamily+';font-size:'+fs+'px;line-height:1.3;';
  m.innerHTML=el.innerHTML;
  document.body.appendChild(m);
  const w=m.getBoundingClientRect().width;
  m.remove();
  return w;
}
function fitPic(){
  const el=document.getElementById('qpic');
  if(!el) return;
  el.style.fontSize='';
  const base=parseFloat(getComputedStyle(el).fontSize)||52;
  const avail=el.clientWidth-10;
  let fs=base;
  for(let i=0;i<4;i++){
    const w=measurePicWidth(el, fs);
    if(w<=avail) break;
    fs=Math.max(14, Math.floor(fs*(avail-4)/w));
    if(fs<=14) break;
  }
  if(fs>=20){
    // 字号仍然够大：整行按比例缩小显示（不换行，保持"从左往右数"等语义）
    if(fs<base) el.style.fontSize=fs+'px';
  } else {
    // 物品太多、缩到 20px 以下会看不清：改为稍大字号 + 自动换行（计数类题目可接受）
    el.querySelectorAll('.no-wrap').forEach(s => { s.style.whiteSpace='normal'; });
    el.style.fontSize='22px';
  }
}
let _fitTimer=null;
window.addEventListener('resize', ()=>{ clearTimeout(_fitTimer); _fitTimer=setTimeout(fitPic, 120); });

/* ---------- 路由 ---------- */
function route(){
  const h = (location.hash||'#/home').replace(/^#\/?/,'');
  const p = h.split('/').filter(Boolean);
  if(!p.length || p[0]==='home') renderHome();
  else if(p[0]==='story'){
    if(p[1]) renderStoryReader(p[1], p[2]!==undefined ? parseInt(p[2],10) : 0);
    else renderStoryBooks();
  }
  else if(p[0]==='m'){
    const m=mod(p[1]);
    const si = p[2]!==undefined ? parseInt(p[2],10) : null;
    const qi = p[3]!==undefined ? parseInt(p[3],10) : null;
    renderModule(m,si,qi);
  }
  else if(p[0]==='english'){
    if(p[1]) renderEnglishStage(p[1], p[2]!==undefined ? parseInt(p[2],10) : 0);
    else renderEnglishScenes();
  }
  else if(p[0]==='parents') renderParents();
  else renderHome();
}
window.addEventListener('hashchange', route);

/* ---------- 导航 ---------- */
function buildTabs(cur){
  const el=document.getElementById('tabs');
  let html='<button class="tab'+(cur==='home'?' on':'')+'" style="'+(cur==='home'?'background:#f97316':'')+'" onclick="location.hash=\'#/home\'">🏠 首页</button>';
  html+='<button class="tab'+(cur==='story'?' on':'')+'" style="'+(cur==='story'?'background:#10b981':'')+'" onclick="location.hash=\'#/story\'">📚 故事绘本</button>';
  html+='<button class="tab'+(cur==='english'?' on':'')+'" style="'+(cur==='english'?'background:#2563eb':'')+'" onclick="location.hash=\'#/english\'">🗣️ 场景口语</button>';
  for(const m of DATASETS){
    const on = cur===m.id;
    html+='<button class="tab'+(on?' on':'')+'" style="'+(on?('background:'+m.color):'')+'" onclick="location.hash=\'#/m/'+m.id+'\'">'+
          m.icon+' '+m.short+'</button>';
  }
  el.innerHTML=html;

function renderModule(m, si, qi){
  if(!m){ renderHome(); return; }
  buildTabs(m.id);
  updatePill();
  const sol=solvedOfMod(m), tot=totalQs(m), pct=Math.round(sol/tot*100);
  document.getElementById('main').innerHTML =
    '<div class="mhead"><span class="big">'+m.icon+'</span>'+
    '<h2>'+m.name+'</h2>'+
    '<div class="dsc">'+m.desc+' · 已完成 '+sol+'/'+tot+' 题，获得 ⭐ '+starsOfMod(m)+'</div>'+
    '<button class="tbtn" onclick="location.hash=\'#/home\'">🏠 首页</button></div>'+
    '<div id="mBody"></div>';
  if(si===null){
    renderSetList(m);
  } else if(m.layout==='song'){
    renderSongSet(m,si);
  } else {
    S.mid=m.id; S.si=si;
    S.qi = (qi!==undefined && qi!==null && qi>=0 && qi<m.sets[si].qs.length) ? qi : 0;
    S.setStars=0; S.streak=0;
    renderQ();
  }
}

function renderQ(){
  const m=mod(S.mid), s=m.sets[S.si], q=s.qs[S.qi];
  S.done=false; S.firstTry=true; S.wrongs=0;
  const solvedQ = isDone(S.mid,S.si,S.qi);
  const pic = isSvg(q.pic) ? q.pic : q.pic;
  const hanziChar = getCharFromQ(q);

  let interactHtml = '';
  if(q.match){
    // 🔗 原生触屏/鼠标动手连线题型 (Match Line)
    interactHtml = renderMatchHtml(q);
  } else if(q.drag){
    // 原生触屏/鼠标动手拖拽题型
    interactHtml =
      '<div class="drag-container" id="dragContainer">' +
        '<div style="font-size:.92rem;font-weight:900;color:#c2410c;text-align:center;margin-bottom:10px">🖐️ 动动小手指：按住物品拖进对应的框里吧！</div>' +
        '<div class="drag-items-pool">' +
          q.drag.items.map(it => '<div class="drag-item" data-type="' + it.type + '">' + it.text + '</div>').join('') +
        '</div>' +
        '<div class="drop-zones">' +
          q.drag.zones.map(z => '<div class="drop-zone" data-target="' + z.target + '"><div style="font-weight:900;font-size:1.05rem">' + z.label + '</div><div style="font-size:.78rem;color:#8a6d4b">' + z.desc + '</div></div>').join('') +
        '</div>' +
      '</div>';
  } else {
    // 标准点选
    interactHtml =
      '<div class="opts" id="opts">' +
        q.opts.map((o,i)=>'<button class="opt" data-i="'+i+'" onclick="choose('+i+',this)">'+optHtml(o)+'</button>').join('') +
      '</div>';
  }

  document.getElementById('mBody').innerHTML =
  '<div class="qtop">'+
    '<button class="tbtn" onclick="history.back()">← 返回</button>'+
    '<div class="qprog">第 '+(S.qi+1)+' / '+s.qs.length+' 题 · 本组 ⭐'+S.setStars+'</div>'+
    (hanziChar ? '<button class="tbtn" style="color:#c2410c;border-color:#f97316;font-weight:900;background:#fff7ed" onclick="openHanziWriter(\''+hanziChar+'\')">✍️ 笔顺描红</button>' : '')+
    '<button class="tbtn" onclick="printSet()">🖨️ 作业纸</button>'+
  '</div>'+
  '<div class="qcard" id="qcard">'+
    '<div class="qpic'+(q.picSmall?' small':'')+'" id="qpic">'+pic+'</div>'+
    '<div class="qtext">'+q.q+' <button class="spk" id="btnSayQ" title="读题" onclick="sayQ(this)">🔊</button></div>'+
    interactHtml+
    '<div class="hintwrap"><details><summary>💡 提示</summary><p>'+(q.h||'数一数、看一看图，再想一想哦！')+'</p></details></div>'+
    '<div class="feedback" id="feedback"></div>'+
    '<div class="btnrow">'+
      '<button class="answersmall" id="btnAnswer" onclick="revealAnswer()">👀 看答案</button>'+
    '</div>'+
  '</div>';

  if(q.match){
    setTimeout(() => {
      initPointerMatch('matchContainer', () => {
        S.done = true;
        mark(S.qi, 'first');
        S.setStars = starsOfSet(S.mid, S.si);
        showAns(true, false);
      });
    }, 80);
  } else if(q.drag){
    setTimeout(() => {
      initPointerDrag('dragContainer', () => {
        S.done = true;
        mark(S.qi, 'first');
        S.setStars = starsOfSet(S.mid, S.si);
        showAns(true, false);
      });
    }, 80);
  }

  if(store.s.autoRead) setTimeout(() => {
    const b = document.getElementById('btnSayQ');
    sayQ(b);
  }, 450);
  if(solvedQ) setTimeout(()=>showAns(false,true), 250);
  requestAnimationFrame(fitPic);
  setTimeout(fitPic, 60);
  setTimeout(preloadNextAudio, 800);
}

function choose(i, el){
  if(S.done) return;
  const q=curQ();
  if(i===q.a){
    S.done=true; sfx(true);
    el.classList.add('right'); confetti(el);
    document.querySelectorAll('.opt').forEach(b=>{ if(b!==el) b.disabled=true; });
    mark(S.qi, 'first');
    S.setStars = starsOfSet(S.mid,S.si);
    showAns(true,false);
  } else {
    el.classList.add('wrong'); el.disabled=true;
    S.firstTry=false; S.wrongs++; sfx(false);
    const fb=document.getElementById('feedback');
    fb.innerHTML='<div class="nudge">'+AGAIN[Math.min(S.wrongs-1,AGAIN.length-1)]+'</div>';
    if(S.wrongs>=2){ const b=document.getElementById('btnAnswer'); if(b) b.scrollIntoView({behavior:'smooth',block:'center'}); }
  }
}

function showAns(celebrate, silentMark){
  const m=mod(S.mid), q=curQ();
  S.done=true;
  const opts=document.querySelectorAll('.opt');
  opts.forEach(b=>{ b.disabled=true; if(+b.dataset.i===q.a) b.classList.add('right'); });
  const fb=document.getElementById('feedback');
  try{
    const card=document.getElementById('qcard');
    if(celebrate) { sfx(true); confetti(card); card.scrollIntoView({behavior:'smooth',block:'center'}); }
  }catch(e){}
  const alr = silentMark ? '（这道题之前做过啦）' : '';
  const hanziChar = getCharFromQ(q);
  const isTenFrameApplicable = (S.mid === 'calc' || S.mid === 'math') && (!m.sets[S.si] || !/反义词/.test(m.sets[S.si].name));

  fb.innerHTML =
    (celebrate?'<div class="praise">'+PRAISE[Math.floor(Math.random()*PRAISE.length)]+'</div>':'<div class="praise">答案来咯！🧐</div>')+
    '<div class="anscard">'+
      '<div class="ah">✅ 正确答案：'+optHtml(q.opts[q.a])+' '+alr+'</div>'+
      '<div class="why">'+q.w+'</div>'+
      '<div class="btnrow2">'+
        '<button class="spk2" id="btnSayWhy" onclick="sayWhy(this)">🔊 听小老师讲一讲</button>'+
        (m.layout!=='song' ? '<button class="spk2 animbtn" onclick="openAnim()">🎬 动画讲解</button>' : '')+
        (hanziChar ? '<button class="spk2" style="background:#fff7ed;border-color:#f97316;color:#c2410c;font-weight:900" onclick="openHanziWriter(\''+hanziChar+'\')">✍️ 笔顺描红</button>' : '')+
        (isTenFrameApplicable ? '<button class="spk2" style="background:#eff6ff;border-color:#3b82f6;color:#1d4ed8;font-weight:900" onclick="openTenFrameModal()">🔟 十格阵教具</button>' : '')+
      '</div>'+
    '</div>'+
    '<div class="btnrow">'+
      (S.qi+1 < m.sets[S.si].qs.length
        ? '<button class="mainbtn" onclick="nextQ()">下一题 ➡️</button>'
        : '<button class="mainbtn" onclick="nextQ()">本组完成 🏁</button>')+
    '</div>';
  if(!silentMark) {
    setTimeout(() => {
      const b = document.getElementById('btnSayWhy');
      speak(q.w, q.lang, S.mid + '_' + S.si + '_' + S.qi + '_w', b);
    }, 120);
  }
}

function revealAnswer(){
  if(S.done && document.querySelector('.anscard')){ toast('已经知道答案啦，点下一题吧！'); return; }
  const q=curQ();
  mark(S.qi, 'helped');
  S.setStars = starsOfSet(S.mid,S.si);
  showAns(false,false);
}

function nextQ(){
  const m=mod(S.mid), s=m.sets[S.si];
  if(S.qi+1 < s.qs.length){ S.qi++; renderQ(); }
  else setDonePanel();
}
function setDonePanel(){
  const m=mod(S.mid), s=m.sets[S.si];
  document.getElementById('mBody').innerHTML =
  '<div class="qcard donepanel">'+
    '<div class="big">🏅</div>'+
    '<h3>这一组闯关完成啦！</h3>'+
    '<div class="sub">你完成了「'+s.name+'」全部 '+s.qs.length+' 题，本组共获得 ⭐ '+starsOfSet(S.mid,S.si)+'</div>'+
    '<div class="btnrow">'+
      '<button class="mainbtn" onclick="S.qi=0;S.setStars=0;renderQ()">🔁 再练一次</button>'+

function formatPrintPic(rawPic){
  if(!rawPic) return '';
  return rawPic.replace(/　+/g, ' ');
}
function printPicClass(pic){
  if(!pic) return 'pic-lg';
  const toks = picTokens(pic);
  const n = toks.length;
  if(n >= 7) return 'pic-xs';
  if(n >= 5) return 'pic-sm';
  if(n >= 3) return 'pic-md';
  return 'pic-lg';
}

/* ---------- ✍️ 汉字笔顺与手指描红（Hanzi-Writer） ---------- */
let _activeWriter = null;
function getCharFromQ(q){
  if(!q) return null;
  const ans = stripPlain(q.opts[q.a]);
  if(ans && window.HANZI_DATA && window.HANZI_DATA[ans]) return ans;
  for(const opt of q.opts){
    const t = stripPlain(opt);
    if(t && t.length === 1 && window.HANZI_DATA && window.HANZI_DATA[t]) return t;
  }
  return null;
}

function openHanziWriter(char, customPinyin, customWords){
  if(!window.HanziWriter){
    toast('笔顺组件正在加载，请稍候重试～');
    return;
  }
  const charData = window.HANZI_DATA ? window.HANZI_DATA[char] : null;
  if(!charData){
    toast('暂未收录生字「' + char + '」的笔顺数据');
    return;
  }

  const q = curQ();
  let pinyin = customPinyin;
  let words = customWords;
  if(!pinyin && q && q.w){
    const pm = stripPlain(q.w).match(/读音[：:]\s*([a-zA-Zāáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜ]+)/);
    if(pm) pinyin = pm[1];
    const wm = stripPlain(q.w).match(/组词[：:]\s*([^。]+)/);
    if(wm) words = wm[1];
  }
  pinyin = pinyin || '';
  words = words || (char + '宝宝');

  const el = document.getElementById('modalCard');
  el.classList.remove('wide');
  el.innerHTML =
    '<div class="hanzi-modal">' +
      '<div class="hanzi-pinyin">' + pinyin + ' <button class="spk" style="width:34px;height:34px;font-size:.95rem;vertical-align:middle" onclick="speak(\'' + char + '\',\'zh-CN\')">🔊</button></div>' +
      '<div class="hanzi-box">' +
        '<div class="mizige-bg"></div>' +
        '<div id="hanziTarget" class="hanzi-target"></div>' +
      '</div>' +
      '<div class="hanzi-info">💡 <b>组词巧记：</b>' + words + '</div>' +
      '<div class="btnrow" style="margin-top:14px">' +
        '<button class="mainbtn" onclick="animateHanzi()">▶️ 笔顺演示</button>' +
        '<button class="ghostbtn" style="border-color:#f97316;color:#ea580c;font-weight:900" onclick="quizHanzi()">✍️ 手指描红</button>' +
        '<button class="ghostbtn" onclick="closeModal()">关闭</button>' +
      '</div>' +
    '</div>';
  document.getElementById('modalBack').classList.remove('hidden');

  setTimeout(() => {
    const target = document.getElementById('hanziTarget');
    if(!target) return;
    target.innerHTML = '';
    _activeWriter = HanziWriter.create(target, char, {
      width: 220,
      height: 220,
      padding: 10,
      showOutline: true,
      strokeColor: '#332619',
      radicalColor: '#f97316',
      outlineColor: '#fed7aa',
      drawingColor: '#2563eb',
      drawingWidth: 20,
      strokeAnimationSpeed: 1.2,
      delayBetweenStrokes: 180,
      charDataLoader: function(c, onComplete){
        if(window.HANZI_DATA && window.HANZI_DATA[c]){
          onComplete(window.HANZI_DATA[c]);
        }
      }
    });
    animateHanzi();
  }, 80);
}

function animateHanzi(){
  if(!_activeWriter) return;
  _activeWriter.cancelQuiz();
  _activeWriter.animateCharacter();
}

function quizHanzi(){
  if(!_activeWriter) return;
  toast('用手指或鼠标在田字格里一笔一划写出来吧！');
  _activeWriter.quiz({
    onMistake: function(strokeData) {
      sfx(false);
      toast('笔画写错啦，再试一笔哦～');
    },
    onCorrectStroke: function(strokeData) {
      sfx(true);
    },
    onComplete: function(summaryData) {
      sfx(true);
      const box = document.querySelector('.hanzi-box');
      if(box) confetti(box);
      toast('太棒啦！「' + _activeWriter._character + '」写得真工整！🎉');
    }
  });
}

/* ---------- 🔟 新加坡数学十格阵（Ten-Frame） ---------- */
let _tenFrameCount = 0;
function openTenFrameModal(initNum){
  let n = initNum;
  if(n === undefined){
    const q = curQ();
    const digits = (q ? q.q.match(/\d+/g) : []) || [];
    const ansN = q ? parseInt(stripPlain(q.opts[q.a]), 10) : NaN;
    n = !isNaN(ansN) && ansN <= 10 && ansN > 0 ? ansN : (digits.length ? parseInt(digits[0], 10) : 5);
  }
  if(isNaN(n) || n < 1 || n > 10) n = 5;
  _tenFrameCount = n;

  const el = document.getElementById('modalCard');
  el.classList.add('wide');
  el.innerHTML =
    '<h3>🔟 新加坡数学 · 十格阵数感教具</h3>' +
    '<div style="text-align:center;font-size:.92rem;color:#8a6d4b;margin-bottom:8px">' +
      '新加坡数学核心教具：先满 5 个（第一排），再凑 10 个！点击方格可放入或拿走小球 🏀' +
    '</div>' +
    '<div id="tenFrameBoard" class="tenframe-board"></div>' +
    '<div id="tenFrameFormula" style="text-align:center;font-size:1.15rem;font-weight:900;color:#1e3a8a;margin:10px 0"></div>' +
    '<div class="btnrow" style="margin-top:14px">' +
      '<button class="mainbtn" onclick="playTenFrameAnim(' + n + ')">🎬 看十格阵动画演示</button>' +
      '<button class="ghostbtn" onclick="resetTenFrame(0)">清空小球</button>' +
      '<button class="ghostbtn" onclick="resetTenFrame(5)">放满 5 个</button>' +
      '<button class="ghostbtn" onclick="resetTenFrame(10)">凑满 10 个</button>' +
      '<button class="ghostbtn" onclick="closeModal()">关闭</button>' +
    '</div>';
  document.getElementById('modalBack').classList.remove('hidden');
  renderTenFrameBoard();
}

function renderTenFrameBoard(){
  const board = document.getElementById('tenFrameBoard');
  const formula = document.getElementById('tenFrameFormula');
  if(!board) return;
  let gridHtml = '<div class="tenframe-grid">';
  for(let i = 0; i < 10; i++){
    const filled = i < _tenFrameCount;
    gridHtml += '<div class="tenframe-cell ' + (filled ? 'filled' : '') + '" onclick="toggleTenFrameCell(' + i + ')">' +
      (filled ? (i < 5 ? '🔴' : '🔵') : '') +
    '</div>';
  }
  gridHtml += '</div>';
  board.innerHTML = gridHtml;

  const topRow = Math.min(_tenFrameCount, 5);
  const bottomRow = Math.max(0, _tenFrameCount - 5);
  const remain = 10 - _tenFrameCount;
  let formulaText = '当前一共有 <b>' + _tenFrameCount + '</b> 个小球';
  if(_tenFrameCount === 0){
    formulaText = '当前是 0 个，快点一下方格放小球吧！';
  } else if(_tenFrameCount === 5){
    formulaText = '🌟 第一排正好满 5 个啦！数感小达人！';
  } else if(_tenFrameCount === 10){
    formulaText = '🎉 太棒了！两排全部摆满，正好是 10！';
  } else if(_tenFrameCount > 5){
    formulaText = '第一排满 5 个 ＋ 第二排 ' + bottomRow + ' 个 ＝ 一共 <b>' + _tenFrameCount + '</b> 个（还差 ' + remain + ' 个满 10）';
  } else {
    formulaText = '第一排有 ' + topRow + ' 个（还差 ' + (5 - topRow) + ' 个满 5）';
  }
  if(formula) formula.innerHTML = formulaText;
}

function toggleTenFrameCell(i){
  sfx(true);
  if(i + 1 === _tenFrameCount){
    _tenFrameCount--;
  } else {
    _tenFrameCount = i + 1;
  }
  renderTenFrameBoard();
}

function resetTenFrame(n){
  sfx(true);
  _tenFrameCount = n;
  renderTenFrameBoard();
}

function playTenFrameAnim(n){
  const el = document.getElementById('modalCard');
  el.classList.add('wide');
  el.innerHTML =
    '<h3>🎬 新加坡数学 · 十格阵动画演示</h3>' +
    '<div class="animbox" id="animBox"></div>' +
    '<div class="animtips">💡 画面演示先满 5、再凑 10 的新加坡数学数感思维！</div>' +
    '<div class="btnrow" style="margin-top:12px">' +

      '<button class="ghostbtn" onclick="closeModal()">关闭</button>' +

    const box = document.getElementById('animBox');

/* ---------- 🖐️ 触屏/鼠标原生拖拽 ---------- */
function initPointerDrag(containerId, onAllPlaced){
  const container = document.getElementById(containerId);
  if(!container) return;
  const items = container.querySelectorAll('.drag-item');
  const zones = container.querySelectorAll('.drop-zone');

  let activeItem = null;
  let startX = 0, startY = 0;
  let initLeft = 0, initTop = 0;
  let currentHoverZone = null;

  items.forEach(item => {
    item.addEventListener('pointerdown', e => {
      if(item.classList.contains('placed')) return;
      activeItem = item;
      item.setPointerCapture(e.pointerId);
      const rect = item.getBoundingClientRect();
      startX = e.clientX;
      startY = e.clientY;
      initLeft = rect.left;
      initTop = rect.top;

      item.style.position = 'fixed';
      item.style.left = initLeft + 'px';
      item.style.top = initTop + 'px';
      item.style.zIndex = '999';
      item.style.width = rect.width + 'px';
      item.style.transition = 'none';
    });

    item.addEventListener('pointermove', e => {
      if(activeItem !== item) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      item.style.left = (initLeft + dx) + 'px';
      item.style.top = (initTop + dy) + 'px';

      currentHoverZone = null;
      zones.forEach(zone => {
        const zr = zone.getBoundingClientRect();
        if(e.clientX >= zr.left && e.clientX <= zr.right && e.clientY >= zr.top && e.clientY <= zr.bottom){
          zone.classList.add('hover');
          currentHoverZone = zone;
        } else {
          zone.classList.remove('hover');
        }
      });
    });

    const onPointerUp = e => {
      if(activeItem !== item) return;
      try{ item.releasePointerCapture(e.pointerId); }catch(err){}
      activeItem = null;
      zones.forEach(z => z.classList.remove('hover'));

      if(currentHoverZone){
        const targetType = currentHoverZone.dataset.target;
        const itemType = item.dataset.type;
        if(targetType === itemType || targetType === 'any'){
          sfx(true);
          item.classList.add('placed');
          item.style.position = 'static';
          item.style.zIndex = '';
          item.style.width = '';
          currentHoverZone.appendChild(item);
          currentHoverZone.classList.add('filled');
          checkAllPlaced();
          return;
        } else {
          sfx(false);
          toast('哎呀，放错地方啦，再试一试！');
        }
      }

      item.style.position = 'static';
      item.style.left = '';
      item.style.top = '';
      item.style.zIndex = '';
      item.style.width = '';
    };

    item.addEventListener('pointerup', onPointerUp);
    item.addEventListener('pointercancel', onPointerUp);
  });

  function checkAllPlaced(){
    const remaining = container.querySelectorAll('.drag-item:not(.placed)');
    if(remaining.length === 0){
      if(typeof onAllPlaced === 'function') onAllPlaced();
    }
  }
}

/* ---------- 🎬 动画讲解（Remotion 播放器） ---------- */
function stripPlain(s){ return String(s||'').replace(/<[^>]+>/g,''); }
function picTokens(s){ return Array.from(stripPlain(s).trim().split(/\s+/)); }
function buildAnimProps(mid,si,q){
  const m = mod(mid);
  const s = m && m.sets ? m.sets[si] : null;
  const toks = picTokens(q.pic);
  const emo  = toks.length ? toks[0] : '🍎';
  const cntOf = e => toks.filter(t=>t===e).length;

  // 1. 口算加减法（加法、减法、分成）
  if(mid==='calc'){
    const ns=(q.q.match(/\d+/g)||[]).map(Number);
    if(si===0||si===2){
      const a=ns[0]||1, b=ns[1]||1;
      return {type:'add',emoji:emo,a,b,duration:Math.max(420,(a+b)*20+340)};
    }
    if(si===1||si===3){
      const a=ns[0]||3, b=ns[1]||1;
      const t=q.q;
      const mode=/吃/.test(t)?'eat':/飞/.test(t)?'fly':/游|藏/.test(t)?'swim':/送|摘|发/.test(t)?'give':'eat';
      return {type:'sub',emoji:emo,a,b,mode,duration:Math.max(400,a*16+b*38+210)};
    }
    if(si===4){
      const t=ns[0]||5, p=ns[1]||1;
      return {type:'split',emoji:emo,t,p,duration:t*26+270};
    }
  }

  // 2. 数学基础（数数、比较、序数、相邻数、单双数）
  if(mid==='math'){
    if(si===0||si===1){
      const n=parseInt(q.opts[q.a],10);
      if(!isNaN(n)) return {type:'count',emoji:si===0?'🟠':emo,n,duration:Math.max(200,20+n*30+170)};
    }
    if(si===2){
      const gs=stripPlain(q.pic).split('　').map(x=>x.trim()).filter(Boolean);
      if(gs.length>=2 && !/\d/.test(gs[0])){
        const aE=picTokens(gs[0])[0], bE=picTokens(gs[1])[0];
        const aN=picTokens(gs[0]).filter(x=>x===aE).length, bN=picTokens(gs[1]).filter(x=>x===bE).length;
        return {type:'compare',aE,bE,aN,bN,rel:aN>bN?'>':(aN<bN?'<':'='),duration:330};
      }
      const ns=(q.q.match(/\d+/g)||[]).map(Number);
      const ansT=String(q.opts[q.a]);
      const rel=(ansT==='>'||ansT==='<'||ansT==='=')?ansT:((ns[0]>ns[1])?'>':(ns[0]<ns[1])?'<':'=');
      return {type:'compare',aN:ns[0]||1,bN:ns[1]||1,rel,duration:330};
    }
    if(si===3){
      const counts={}; toks.forEach(x=>counts[x]=(counts[x]||0)+1);
      const diff=Object.keys(counts).find(k=>counts[k]===1);
      const pos=diff ? toks.indexOf(diff)+1 : 1;
      return {type:'ordinal',items:toks,pos,duration:120+toks.length*38+110};
    }
    if(si===4){
      const n=parseInt(stripPlain(q.pic),10);
      if(!isNaN(n)) return {type:'neighbor',n,duration:340};
    }
    if(si===5){
      const ansT=String(q.opts[q.a]);
      if(ansT.startsWith('左')||ansT.startsWith('右')) return {type:'oddLine',duration:320};
      const digits=stripPlain(q.pic).match(/\d+/);
      if(digits){ const dn=parseInt(digits[0],10); return {type:'oddEven',emoji:'🔵',n:dn,duration:Math.max(340,30+dn*30+240)}; }
      const cn=cntOf(emo);
      return {type:'oddEven',emoji:emo,n:cn,duration:Math.max(340,30+cn*30+240)};
    }
  }

  // 3. 识字乐园（反义词 vs 认字卡片）
  if(mid==='read'){
    if(s && /反义词/.test(s.name)){
      const ansT = stripPlain(q.opts[q.a]);
      const qText = stripPlain(q.q);
      const targetMatch = qText.match(/[“"']([^“”"']+)[”"']的反义词/);
      const leftWord = targetMatch ? targetMatch[1] : (ansT === '小' ? '大' : '反义词');
      const rightWord = ansT;
      const leftPic = toks[0] || '🐘';
      const rightPic = toks[1] || '🐜';
      const wMatch = stripPlain(q.w).match(/造句[：:](.*)/);
      const contrastDesc = wMatch ? wMatch[1].trim() : (leftWord + ' 与 ' + rightWord + ' 是一对相反的词');
      return {
        type: 'antonym',
        leftWord,
        rightWord,
        leftPic,
        rightPic,
        contrastDesc,
        duration: 340
      };
    }
    const ansT = stripPlain(q.opts[q.a]);
    const pinyinMatch = stripPlain(q.w).match(/读音[：:]\s*([a-zA-Zāáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜ]+)/);
    const wordsMatch = stripPlain(q.w).match(/组词[：:]\s*([^。]+)/);
    const sentMatch = stripPlain(q.w).match(/句子[：:]\s*([^。]+)/);
    return {
      type: 'wordCard',
      char: ansT,
      pinyin: pinyinMatch ? pinyinMatch[1] : '',
      pic: isSvg(q.pic) ? '📖' : (toks[0] || '📖'),
      words: wordsMatch ? wordsMatch[1] : (ansT + '宝宝'),
      sentence: sentMatch ? sentMatch[1] : '',
      duration: 360
    };
  }

  // 4. 安全好习惯
  if(mid==='safe'){
    const cleanW = stripPlain(q.w).replace(/<[^>]+>/g,'').slice(0, 36);
    return {
      type: 'safetyRule',
      title: s ? s.name : '安全小卫士',
      pic: isSvg(q.pic) ? '🚦' : (toks.slice(0, 3).join(' ') || '🚦'),
      rule: cleanW,
      isSafe: true,
      duration: 340
    };
  }

  // 5. 科学小实验与探索
  if(mid==='science'){
    const cleanAns = stripPlain(q.opts[q.a]);
    const cleanW = stripPlain(q.w).replace(/<[^>]+>/g,'').slice(0, 42);
    return {
      type: 'experiment',
      title: s ? s.name : '科学小问号',
      pic: isSvg(q.pic) ? '🧪' : (toks.slice(0, 3).join(' ') || '🧪'),
      action: cleanAns,
      desc: cleanW,
      duration: 350
    };
  }

  // 6. 社会大本营
  if(mid==='society'){
    const cleanAns = stripPlain(q.opts[q.a]);
    const cleanW = stripPlain(q.w).replace(/<[^>]+>/g,'').slice(0, 38);
    return {
      type: 'societyJob',
      title: s ? s.name : '社会大家庭',
      pic: isSvg(q.pic) ? '🤝' : (toks[0] || '🤝'),
      role: cleanAns,
      desc: cleanW,
      duration: 340
    };
  }

  // 7. 英语启蒙与情境口语
  if(mid==='eng'){
    const cleanAns = stripPlain(q.opts[q.a]);
    const cleanW = stripPlain(q.w).replace(/<[^>]+>/g,'').slice(0, 42).trim();
    return {
      type: 'conceptCard',
      title: '🔤 ' + (s ? s.name : '英语磨耳朵'),
      pic: isSvg(q.pic) ? '🔤' : (toks.slice(0, 2).join(' ') || '🔤'),
      ans: cleanAns,
      why: cleanW,
      duration: 340
    };
  }

  // 8. 全场景通用概念兜底动画（图形、逻辑、其他所有场景 100% 覆盖）
  const cleanAns = stripPlain(q.opts[q.a]);
  const cleanWhy = stripPlain(q.w).replace(/这是<b>.*?<\/b>/g,'').slice(0, 42).trim();
  return {
    type: 'conceptCard',
    title: (m ? m.name : '中班学习') + (s ? ' · ' + s.name : ''),
    pic: isSvg(q.pic) ? '🎨' : (toks[0] || '⭐'),
    ans: cleanAns,
    why: cleanWhy,
    duration: 330
  };
}
function toggleAnimVoice(){
  const q = curQ();
  const audioId = S.mid + '_' + S.si + '_' + S.qi + '_w';
  const btn = document.getElementById('btnAnimVoice');
  if(btn && btn.classList.contains('speaking-active')){
    stopSpeak();
  } else {
    speak(q.w, q.lang, audioId, btn);
  }
}
function openAnim(){
  const m=mod(S.mid), q=curQ();
  const p=buildAnimProps(S.mid,S.si,q);
  if(!p){ toast('这道题暂时没有动画，听小老师讲讲吧～'); return; }
  if(!window.ZZBAnim){ toast('动画组件加载失败，请检查网络后刷新页面'); return; }
  const el=document.getElementById('modalCard');
  el.classList.add('wide');
  el.innerHTML='<h3>🎬 动画讲解 <span style="font-size:.85rem;font-weight:600;color:#a58c6b">— '+(m.short)+' · 边看动画边听小老师讲！</span></h3>'+
    '<div class="animbox" id="animBox"></div>'+
    '<div class="animtips">💡 画面演示解题步骤，小老师同步原声讲解；随时可点下方按钮重听或暂停</div>'+
    '<div class="btnrow" style="margin-top:12px">'+
      '<button class="spk2" id="btnAnimVoice" onclick="toggleAnimVoice()">🔊 听小老师讲解（点我重播）</button>'+
      '<button class="mainbtn" onclick="closeModal()">关闭动画</button>'+
    '</div>';
  document.getElementById('modalBack').classList.remove('hidden');

  // 1. 播放欢快启蒙开场琶音
  animSfx();

  // 2. 挂载并启动 Remotion 播放器
  setTimeout(()=>{
    const box=document.getElementById('animBox');
    if(box && window.ZZBAnim) window.ZZBAnim.play(p, box);

    // 3. 伴随动画启动小老师高保真原声讲解（带按钮动效）
    setTimeout(()=>{
      const btn = document.getElementById('btnAnimVoice');
      speak(q.w, q.lang, S.mid + '_' + S.si + '_' + S.qi + '_w', btn);
    }, 240);
  }, 60);
}
function clearData(){
  if(confirm('确定要清空所有学习记录和星星吗？')){ store=freshStore(); save(); toast('已清空，重新开始！'); updatePill(); route(); }
}

/* ---------- 启动 ---------- */
initEyeCareTimer();
updatePill();
route();

/* ---------- PWA 离线支持 ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Service Worker 注册提示:', err);
    });
  });
}

/* 调试暴露（供家长查看进度） */
window.__APP = { data: DATASETS, store, S };
</script>
